<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div class="main">
      <div class="main2">
        <div class="main3">
          <div class="git">
            <img src="image/GITHUB.png" alt="" />
          </div>
          <div class="text">
            <p>Your journey starts here</p>
            <p id="yes">Take the first step</p>
          </div>
        </div>
        <div class="main4">
          <form action="">
            <div>
              <input type="email" placeholder="E-mail" required />
            </div>
            <div>
              <input type="text" placeholder="Username" required />
            </div>
            <div>
              <input
                type="password"
                placeholder="Password"
                required
                maxlength="7"
              />
            </div>
            <div>
              <input
                type="password"
                placeholder="Confirm password"
                required
                maxlength="7"
              />
            </div>
            <button>Sign up</button>
          </form>
          <p>____________________ or __________________</p>
        </div>
        <div class="logos">
          <img src="image/facebook.png" alt="" />
          <img
            src="image/Apple-Logo-Iconic-Tech-Brand-Symbol-PNG-Transparent-Representation-of-Innovation-and-Design-jpg.webp"
            alt=""
          />
          <img src="image/google-black-icon.png" alt="" />
        </div>
        <div class="text2">
          <p>Already have an account? <a href="#">Sign in</a></p>
        </div>
      </div>
    </div>
  </body>
</html>
